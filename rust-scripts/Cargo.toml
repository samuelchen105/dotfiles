[workspace]
members = ["crates/devtool"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
eyre = "0.6"
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
chrono = "0.4.45"
regex = "1.12.4"
ratatui = "0.30.2"
crossterm = "0.29.0"
